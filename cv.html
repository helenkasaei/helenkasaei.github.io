<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CV · Helen Kasaei</title>
<style>
  :root{
    --ink:#26241F;
    --paper:#FBFAF5;
    --blue:#2A4D8F;
    --red:#B23A2E;
    --slate:#6E6A5F;
    --line:#DEDACD;
    --menu-hover:rgba(0,0,0,0.045);
    --serif: "Times New Roman", Times, serif;
  }
  html[data-theme="dark"]{
    --ink:#EAE8E1;
    --paper:#1B1C18;
    --blue:#8FB0E8;
    --red:#E28E82;
    --slate:#A6A398;
    --line:#3A3B34;
    --menu-hover:rgba(255,255,255,0.06);
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:var(--serif);
    font-size:18px;
    line-height:1.6;
    transition:background 0.2s ease, color 0.2s ease;
  }
  a{color:var(--blue); text-decoration:none;}
  a:hover{text-decoration:underline;}
  a:focus-visible{outline:2px solid var(--blue); outline-offset:2px;}

  .wrap{max-width:920px; margin:0 auto; padding:0 28px;}

  header.top{padding:52px 0 0; text-align:center; position:relative;}
  header.top h1{
    font-weight:500;
    font-size:clamp(1.9rem, 4.5vw, 2.5rem);
    color:var(--blue);
    margin:0 0 30px;
  }
  #theme-toggle{
    position:absolute;
    top:50%; right:28px;
    transform:translateY(-50%);
    width:32px; height:32px;
    border-radius:50%;
    border:1px solid var(--line);
    background:none;
    color:var(--ink);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  #theme-toggle svg{width:16px; height:16px;}
  #theme-toggle:hover{border-color:var(--blue); color:var(--blue);}
  nav.tabs{
    position:relative;
    border-top:1px solid var(--line);
    border-bottom:1px solid var(--line);
    padding:14px 76px;
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:38px;
    font-size:1.02rem;
  }
  nav.tabs a{color:var(--blue);}
  nav.tabs a.active{font-weight:600; text-decoration:underline;}

  .mobile-menu-btn{
    display:none;
    align-items:center;
    gap:8px;
    background:none;
    border:none;
    color:var(--ink);
    font-family:inherit;
    font-size:1rem;
    cursor:pointer;
    padding:14px 0;
    margin:0 auto;
  }
  .mobile-menu-btn svg{width:20px; height:20px;}

  .mobile-menu{
    display:none;
    flex-direction:column;
    text-align:left;
    border:1px solid var(--line);
    border-radius:8px;
    margin:0 20px 14px;
    overflow:hidden;
    background:var(--paper);
  }
  .mobile-menu.open{display:flex;}
  .mobile-menu a, .mobile-menu button.dark-row{
    padding:14px 18px;
    border:none;
    border-bottom:1px solid var(--line);
    color:var(--ink);
    font-family:inherit;
    font-size:1.05rem;
    text-align:left;
    background:none;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:10px;
  }
  .mobile-menu a:hover{text-decoration:none; color:var(--blue);}
  .mobile-menu button.dark-row{
    background:var(--menu-hover);
    border-bottom:none;
  }
  .mobile-menu button.dark-row svg{width:18px; height:18px;}

  .cv-body{padding:40px 0 60px;}
  .cv-body h2{
    color:var(--blue);
    font-weight:500;
    font-size:1.6rem;
    margin:0 0 6px;
  }
  .cv-body .version{color:var(--slate); font-size:0.95rem; margin:0 0 24px;}
  .cv-fallback{
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:12px;
    border:1px solid var(--line);
    border-radius:6px;
    padding:14px 18px;
    margin:0 0 22px;
  }
  .cv-note{
    font-size:0.9rem;
    color:var(--slate);
    margin:0;
  }
  .cv-download{
    display:inline-flex; align-items:center; gap:7px;
    color:var(--red);
    font-size:1rem;
    font-weight:500;
    margin:0;
  }
  .cv-embed{
    width:100%;
    height:80vh;
    border:1px solid var(--line);
    border-radius:4px;
  }

  footer{
    border-top:1px solid var(--line);
    padding:16px 0 32px;
    text-align:center;
    color:var(--slate);
    font-size:0.9rem;
  }

  @media (max-width:720px){
    nav.tabs{display:none;}
    .mobile-menu-btn{display:flex;}
    .cv-embed{height:65vh;}
  }

  @media (prefers-reduced-motion: reduce){
    html{scroll-behavior:auto;}
  }
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <h1>Helen Kasaei</h1>
    <nav class="tabs">
      <a href="index.html">Home</a>
      <a href="index.html#research">Research</a>
      <a href="index.html#education">Education</a>
      <a href="cv.html" class="active">CV</a>
      <button id="theme-toggle" aria-label="Toggle dark mode" onclick="toggleTheme()"></button>
    </nav>

    <button class="mobile-menu-btn" onclick="toggleMobileMenu()" aria-label="Menu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      Menu
    </button>
    <div id="mobile-menu" class="mobile-menu">
      <a href="index.html">Home</a>
      <a href="index.html#research">Research</a>
      <a href="index.html#education">Education</a>
      <a href="cv.html">CV</a>
      <button class="dark-row" onclick="toggleTheme()">
        <span id="mobile-theme-icon"></span>
        <span id="mobile-theme-label">Dark Mode</span>
      </button>
    </div>
  </div>
</header>

<div class="wrap cv-body">
  <h2>Curriculum Vitae</h2>
  <p class="version">Latest Version: September 2026</p>

  <div class="cv-fallback">
    <p class="cv-note">Having trouble viewing the PDF below?</p>
    <a class="cv-download" href="cv.pdf" download>
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 21h14"/></svg>
      Download CV (PDF)
    </a>
  </div>

  <iframe class="cv-embed" src="cv.pdf" title="Helen Kasaei CV"></iframe>
</div>

<footer>Helen Kasaei · helenkasaei@gmail.com</footer>

<script>
  var moonIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>';
  var sunIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';

  function updateThemeIcons(){
    var dark = document.documentElement.getAttribute('data-theme') === 'dark';
    document.getElementById('theme-toggle').innerHTML = dark ? sunIcon : moonIcon;
    var mIcon = document.getElementById('mobile-theme-icon');
    var mLabel = document.getElementById('mobile-theme-label');
    if(mIcon) mIcon.innerHTML = dark ? sunIcon : moonIcon;
    if(mLabel) mLabel.textContent = dark ? 'Light Mode' : 'Dark Mode';
  }
  function toggleTheme(){
    var html = document.documentElement;
    var dark = html.getAttribute('data-theme') === 'dark';
    html.setAttribute('data-theme', dark ? 'light' : 'dark');
    updateThemeIcons();
  }
  function toggleMobileMenu(){
    document.getElementById('mobile-menu').classList.toggle('open');
  }
  function closeMobileMenu(){
    document.getElementById('mobile-menu').classList.remove('open');
  }
  updateThemeIcons();
</script>
</body>
</html>
