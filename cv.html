<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CV · Helen Kasaei</title>
<style>
  :root{
    --ink:#26241F;
    --paper:#FBFAF5;
    --blue:#2A4D8F;
    --red:#B23A2E;
    --slate:#6E6A5F;
    --line:#DEDACD;
    --serif: "Times New Roman", Times, serif;
  }
  html[data-theme="dark"]{
    --ink:#EAE8E1;
    --paper:#1B1C18;
    --blue:#8FB0E8;
    --red:#E28E82;
    --slate:#A6A398;
    --line:#3A3B34;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:var(--serif);
    font-size:18px;
    line-height:1.6;
    transition:background 0.2s ease, color 0.2s ease;
  }
  a{color:var(--blue); text-decoration:none;}
  a:hover{text-decoration:underline;}
  a:focus-visible{outline:2px solid var(--blue); outline-offset:2px;}

  .wrap{max-width:920px; margin:0 auto; padding:0 28px;}

  header.top{padding:52px 0 0; text-align:center; position:relative;}
  header.top h1{
    font-weight:500;
    font-size:clamp(1.9rem, 4.5vw, 2.5rem);
    color:var(--blue);
    margin:0 0 30px;
  }
  #theme-toggle{
    position:absolute;
    top:50%; right:28px;
    transform:translateY(-50%);
    width:32px; height:32px;
    border-radius:50%;
    border:1px solid var(--line);
    background:none;
    color:var(--ink);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  #theme-toggle svg{width:16px; height:16px;}
  #theme-toggle:hover{border-color:var(--blue); color:var(--blue);}
  nav.tabs{
    position:relative;
    border-top:1px solid var(--line);
    border-bottom:1px solid var(--line);
    padding:14px 0;
    display:flex;
    justify-content:center;
    gap:38px;
    font-size:1.02rem;
  }
  nav.tabs a{color:var(--blue);}
  nav.tabs a.active{font-weight:600; text-decoration:underline;}

  .cv-body{padding:40px 0 60px;}
  .cv-body h2{
    color:var(--blue);
    font-weight:500;
    font-size:1.6rem;
    margin:0 0 6px;
  }
  .cv-body .version{color:var(--slate); font-size:0.95rem; margin:0 0 24px;}
  .cv-note{
    font-size:0.9rem;
    color:var(--slate);
    margin:0 0 8px;
  }
  .cv-download{
    display:inline-flex; align-items:center; gap:7px;
    color:var(--red);
    font-size:1rem;
    font-weight:500;
    margin-bottom:22px;
  }
  .cv-embed{
    width:100%;
    height:80vh;
    border:1px solid var(--line);
    border-radius:4px;
  }

  footer{
    border-top:1px solid var(--line);
    padding:16px 0 32px;
    text-align:center;
    color:var(--slate);
    font-size:0.9rem;
  }

  @media (max-width:720px){
    nav.tabs{gap:22px; font-size:0.95rem;}
    .cv-embed{height:65vh;}
  }

  @media (prefers-reduced-motion: reduce){
    html{scroll-behavior:auto;}
  }
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <h1>Helen Kasaei</h1>
    <nav class="tabs">
      <a href="index.html">Home</a>
      <a href="index.html#research">Research</a>
      <a href="index.html#education">Education</a>
      <a href="cv.html" class="active">CV</a>
      <button id="theme-toggle" aria-label="Toggle dark mode" onclick="
        var html=document.documentElement;
        var dark=html.getAttribute('data-theme')==='dark';
        html.setAttribute('data-theme', dark ? 'light' : 'dark');
        this.innerHTML = dark ? moonIcon : sunIcon;
      "></button>
    </nav>
  </div>
</header>

<div class="wrap cv-body">
  <h2>Curriculum Vitae</h2>
  <p class="version">Latest Version: September 2026</p>

  <p class="cv-note">Having trouble viewing the PDF below?</p>
  <a class="cv-download" href="cv.pdf" download>
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 21h14"/></svg>
    Download CV (PDF)
  </a>

  <iframe class="cv-embed" src="cv.pdf" title="Helen (Zahra) Kasaei CV"></iframe>
</div>

<footer>Helen (Zahra) Kasaei · helenkasaei@gmail.com</footer>

<script>
  var moonIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>';
  var sunIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
  document.getElementById('theme-toggle').innerHTML = moonIcon;
</script>
</body>
</html>
